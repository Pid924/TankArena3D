name: Build and deploy web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and web export templates
        run: |
          cd "$RUNNER_TEMP"
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q -j "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/web_nothreads_*' 'templates/version.txt' -d "$tdir"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test
        run: |
          godot --headless --fixed-fps 60 --script res://tests/smoke_test.gd 2>&1 | grep -vE 'mesh_get_surface_count|Parameter "m" is null' | tee test.log
          grep -q "RESULT: PASS" test.log

      - name: Export for web (single-threaded, works on GitHub Pages)
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
